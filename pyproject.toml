[project]
name = "hrag"
version = "0.1.0"
description = "Public-service knowledge assistant on GCP: Cloud Run, Vertex AI Search, Gemini, eval gate"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "httpx>=0.27"]

[project.optional-dependencies]
gcp = [
  "google-cloud-discoveryengine>=0.13",
  "google-cloud-aiplatform>=1.70",
  "google-cloud-bigquery>=3.25",
  "google-cloud-storage>=2.18",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
