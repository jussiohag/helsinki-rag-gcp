name: PR Title
# Enforces conventional commit format on PR titles.
# Deploy: deploy-ci.sh (always deployed alongside other workflows)

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            test
            refactor
            ci
            style
            perf
            build
            revert
          ignoreLabels: |
            bot
            dependencies
