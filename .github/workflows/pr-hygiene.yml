name: PR Hygiene
# Fails if PR body contains AI-generated footers, placeholder text, or is empty.
# On public repositories also fails when tree, symlinks or history contain
# local environment paths (see <pm repo>/docs/PUBLISHING-STANDARD.md).
# Deploy: deploy-ci.sh (always deployed alongside other workflows)

on:
  pull_request:
    types: [opened, edited, synchronize]
  push:
    branches: [main]

permissions:
  pull-requests: read
  contents: read

jobs:
  pr-body-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for junk
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          violations=()

          # --- Empty body ---
          body_stripped=$(echo "$PR_BODY" | tr -d '[:space:]')
          if [ -z "$body_stripped" ]; then
            echo "::error::PR body is empty. Describe what changed and why."
            exit 1
          fi

          # --- AI-generated footers ---
          patterns=(
            "Generated with Claude Code"
            "Generated with Claude"
            "Generated with [Claude"
            "claude.com/claude-code"
            "🤖 Generated"
            "Co-Authored-By: Claude"
            "noreply@anthropic.com"
            "Generated by Copilot"
            "Generated with GitHub Copilot"
            "Generated by AI"
            "Generated with Cursor"
            "Generated with Windsurf"
          )
          # Footers live at the end — scan only the last 10 lines so a
          # legitimate mention earlier in the body doesn't trip the check.
          body_tail=$(echo "$PR_BODY" | tail -n 10)
          for pattern in "${patterns[@]}"; do
            if echo "$body_tail" | grep -qiF "$pattern"; then
              violations+=("AI footer: $pattern")
            fi
          done

          # --- Unfilled template placeholders ---
          placeholders=(
            "add description here"
            "describe your changes"
            "what does this pr do"
            "replace this text"
            "fill in this section"
          )
          for placeholder in "${placeholders[@]}"; do
            if echo "$PR_BODY" | grep -qiF "$placeholder"; then
              violations+=("Placeholder: $placeholder")
            fi
          done

          # --- Leftover HTML comment instructions ---
          if echo "$PR_BODY" | grep -qE '<!--.*(describe|explain|fill|replace|provide|insert).*-->'; then
            violations+=("Leftover HTML comment instructions in body")
          fi

          if [ ${#violations[@]} -gt 0 ]; then
            echo "::error::PR body needs cleanup:"
            for v in "${violations[@]}"; do
              echo "  - $v"
            done
            exit 1
          fi

          echo "PR body is clean."

  local-env:
    # Runs on the remote so a skipped local hook cannot bypass it.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan tree, symlinks and history for local environment paths
        run: |
          PAT='(/home|/Users)/[A-Za-z0-9_.-]+|~/[A-Za-z]|\$HOME/[A-Za-z]|[A-Za-z]:\\+Users\\+'
          EXCL=(':!*.lock' ':!package-lock.json' ':!yarn.lock' ':!pnpm-lock.yaml' ':!*.min.*')
          found=0
          echo "== tracked files"
          git grep -I -n -E "$PAT" -- . "${EXCL[@]}" && found=1
          echo "== tracked symlinks"
          while read -r mode _blob _stage path; do
            [ "$mode" = 120000 ] || continue
            target=$(git cat-file -p ":$path")
            if echo "$target" | grep -qE "$PAT"; then echo "$path -> $target"; found=1; fi
          done < <(git ls-files -s)
          echo "== history"
          git rev-list --all | xargs -r git grep -I -n -E "$PAT" -- . "${EXCL[@]}" \
            | sed -E 's/^[0-9a-f]{40}://' | sort -u | grep . && found=1
          while read -r _src mode _old blob _status path; do
            [ "$mode" = 120000 ] || continue
            target=$(git cat-file -p "$blob")
            if echo "$target" | grep -qE "$PAT"; then echo "$path -> $target (history)"; found=1; fi
          done < <(git log --all --format= --raw --diff-filter=A --no-renames | sort -u)
          if [ "$found" = 1 ]; then
            echo "::error::Local environment paths in a public repository. Rewrite the lines or scrub history."
            exit 1
          fi
          echo "clean"
