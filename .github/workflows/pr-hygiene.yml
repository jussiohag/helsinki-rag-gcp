name: PR Hygiene
# Fails if PR body contains AI-generated footers, placeholder text, or is empty.
# Deploy: deploy-ci.sh (always deployed alongside other workflows)

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-body-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for junk
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          violations=()

          # --- Empty body ---
          body_stripped=$(echo "$PR_BODY" | tr -d '[:space:]')
          if [ -z "$body_stripped" ]; then
            echo "::error::PR body is empty. Describe what changed and why."
            exit 1
          fi

          # --- AI-generated footers ---
          patterns=(
            "Generated with Claude Code"
            "Generated with Claude"
            "Generated with [Claude"
            "claude.com/claude-code"
            "🤖 Generated"
            "Co-Authored-By: Claude"
            "noreply@anthropic.com"
            "Generated by Copilot"
            "Generated with GitHub Copilot"
            "Generated by AI"
            "Generated with Cursor"
            "Generated with Windsurf"
          )
          # Footers live at the end — scan only the last 10 lines so a
          # legitimate mention earlier in the body doesn't trip the check.
          body_tail=$(echo "$PR_BODY" | tail -n 10)
          for pattern in "${patterns[@]}"; do
            if echo "$body_tail" | grep -qiF "$pattern"; then
              violations+=("AI footer: $pattern")
            fi
          done

          # --- Unfilled template placeholders ---
          placeholders=(
            "add description here"
            "describe your changes"
            "what does this pr do"
            "replace this text"
            "fill in this section"
          )
          for placeholder in "${placeholders[@]}"; do
            if echo "$PR_BODY" | grep -qiF "$placeholder"; then
              violations+=("Placeholder: $placeholder")
            fi
          done

          # --- Leftover HTML comment instructions ---
          if echo "$PR_BODY" | grep -qE '<!--.*(describe|explain|fill|replace|provide|insert).*-->'; then
            violations+=("Leftover HTML comment instructions in body")
          fi

          if [ ${#violations[@]} -gt 0 ]; then
            echo "::error::PR body needs cleanup:"
            for v in "${violations[@]}"; do
              echo "  - $v"
            done
            exit 1
          fi

          echo "PR body is clean."
