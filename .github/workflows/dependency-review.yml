# Dependency Review — checks new dependencies for known vulnerabilities on PRs
# Deployed by: <pm repo>/hooks/deploy-ci.sh
name: Dependency Review
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    # Dependency review API needs GitHub Advanced Security on private repos
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
